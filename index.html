<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Panel Prywatny</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    input, textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 10px; }
    button { padding: 10px 20px; background: #2ea44f; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .logout { float: right; color: #d73a49; text-decoration: none; }
  </style>
</head>
<body>
  <a href="/logout" class="logout">Wyloguj się</a>
  <h1>Witaj na prywatnej stronie!</h1>
  <p>Wpisz dane poniżej, aby automatycznie zapisać plik w repozytorium GitHub:</p>

  <input type="text" id="filename" placeholder="Nazwa pliku (np. notatki/test.txt)" required />
  <textarea id="content" rows="8" placeholder="Treść pliku..."></textarea>
  <button onclick="saveToGithub()">Zapisz plik na GitHubie</button>
  <p id="status"></p>

  <script>
    async function saveToGithub() {
      const filename = document.getElementById('filename').value;
      const content = document.getElementById('content').value;
      const status = document.getElementById('status');

      if (!filename) {
        status.innerText = "Podaj nazwę pliku!";
        return;
      }

      status.innerText = "Zapisywanie...";

      const res = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, content })
      });

      if (res.ok) {
        status.innerText = "Zapisano pomyślnie w repozytorium!";
      } else {
        const err = await res.json();
        status.innerText = "Błąd zapisu: " + (err.error || "Nieznany błąd");
      }
    }
  </script>
</body>
</html>
