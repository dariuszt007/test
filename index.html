<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bezpieczna Strona</title>
    <!-- Wczytanie oficjalnej biblioteki Auth0 -->
    <script src="https://auth0.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .hidden { display: none; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Sekcja widoczna dla NIEZALOGOWANYCH -->
    <div id="gosc-view">
        <h1>Witaj na naszej stronie!</h1>
        <p>Aby zobaczyć ukrytą zawartość, musisz się zalogować.</p>
        <button id="btn-login">Zaloguj się</button>
    </div>

    <!-- Sekcja widoczna TYLKO DLA ZALOGOWANYCH -->
    <div id="tajna-sekcja" class="hidden">
        <h1>🔓 Strefa Zabezpieczona</h1>
        <p>Gratulacje! Widzisz tę treść, ponieważ pomyślnie przeszedłeś weryfikację Auth0.</p>
        <p>Twoje dane logowania są w pełni bezpieczne.</p>
        <button id="btn-logout">Wyloguj się</button>
    </div>

    <script>
        let auth0Client = null;

        // 1. Podmień poniższe dane na Twoje z kroku 3!
        const config = {
            domain: "TUTAJ_WKLEJ_TWOJE_DOMAIN",
            clientId: "TUTAJ_WKLEJ_TWOJE_CLIENT_ID"
        };

        // 2. Inicjalizacja Auth0 po załadowaniu strony
        window.onload = async () => {
            auth0Client = await auth0.createAuth0Client({
                domain: config.domain,
                clientId: config.clientId,
                authorizationParams: {
                    redirect_uri: window.location.href // Automatycznie bierze aktualny adres strony
                }
            });

            // Obsługa powrotu z panelu logowania Auth0
            const query = window.location.search;
            if (query.includes("code=") && query.includes("state=")) {
                await auth0Client.handleRedirectCallback();
                // Czyszczenie paska adresu URL z tokenów Auth0
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // Sprawdzenie czy użytkownik jest już zalogowany
            const isAuthenticated = await auth0Client.isAuthenticated();

            if (isAuthenticated) {
                // Pokaż ukrytą treść
                document.getElementById("gosc-view").classList.add("hidden");
                document.getElementById("tajna-sekcja").classList.remove("hidden");
            } else {
                // Pokaż ekran zachęty do logowania
                document.getElementById("gosc-view").classList.remove("hidden");
                document.getElementById("tajna-sekcja").classList.add("hidden");
            }
        };

        // 3. Obsługa przycisków
        document.getElementById("btn-login").addEventListener("click", async () => {
            await auth0Client.loginWithRedirect();
        });

        document.getElementById("btn-logout").addEventListener("click", () => {
            auth0Client.logout({
                logoutParams: {
                    returnTo: window.location.href
                }
            });
        });
    </script>
</body>
</html>
